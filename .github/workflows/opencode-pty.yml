name: Build opencode-pty for Android (static musl)

# Builds the persistent-pty service of upstream OpenCode (anomalyco/opencode-pty)
# as a STATIC aarch64 musl binary. The kernel execs it directly — no Bionic
# loader involved, so no glibc/musl/TLS constraints (the official gnu wheel
# links glibc, the official musl wheel hardcodes its Unix socket under /tmp,
# which is read-only on Android; our patch routes the socket through
# OPENCODE_PTY_SOCKET_DIR / TMPDIR instead).
#
# Same pattern as bun-pty.yml: apply our patches, verify the ELF, publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'opencode-pty version to build (e.g., 0.2.0)'
        required: true
        default: '0.2.0'
      repo:
        description: 'Upstream opencode-pty repo'
        required: false
        default: 'anomalyco/opencode-pty'
      ref:
        description: 'Upstream ref (default: v<version>; must be an exact tag — the patch anchors to it)'
        required: false
        default: ''

permissions:
  contents: write

env:
  RUST_TARGET: aarch64-unknown-linux-musl
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repo (for patches)
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          set -e
          # Resolve the exact tarball from ziglang's index (file names drift
          # across releases, hand-written URLs 404).
          URL=$(curl -fsSL https://ziglang.org/download/index.json | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball')
          test -n "$URL" && test "$URL" != "null" || { echo "FATAL: no zig $ZIG_VERSION tarball in index"; exit 1; }
          mkdir -p /opt/zig
          curl -fsSL "$URL" | tar xJ -C /opt/zig --strip-components=1
          export PATH="/opt/zig:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          zig version

      - name: Clone opencode-pty
        env:
          PTY_VERSION: ${{ inputs.version || '0.2.0' }}
          PTY_REPO: ${{ inputs.repo || 'anomalyco/opencode-pty' }}
          PTY_REF: ${{ inputs.ref }}
        run: |
          set -e
          REF="${PTY_REF:-v$PTY_VERSION}"
          # The patch anchors to v$PTY_VERSION's source: no default-branch fallback.
          git clone --depth 1 --branch "$REF" "https://github.com/$PTY_REPO.git" /tmp/opencode-pty-src
          cd /tmp/opencode-pty-src
          echo "opencode-pty source at $(git rev-parse --short HEAD)"
          test -f build.rs
          test -f Cargo.toml

      - name: Install pinned toolchain target
        working-directory: /tmp/opencode-pty-src
        run: |
          set -e
          # rust-toolchain.toml pins its own channel; targets are per-toolchain,
          # so the musl target must be added to THAT channel explicitly.
          RVER=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          test -n "$RVER" || { echo "FATAL: no pinned channel found"; exit 1; }
          rustup toolchain install "$RVER" --profile minimal --target "$RUST_TARGET"
          rustup target list --toolchain "$RVER" | grep -F "$RUST_TARGET"

      - name: Apply Android patches
        working-directory: /tmp/opencode-pty-src
        run: |
          set -e
          git apply --stat  "$GITHUB_WORKSPACE/patches/opencode-pty/0001-android-aarch64.patch"
          git apply --check "$GITHUB_WORKSPACE/patches/opencode-pty/0001-android-aarch64.patch"
          git apply         "$GITHUB_WORKSPACE/patches/opencode-pty/0001-android-aarch64.patch"
          echo "[OK] patches applied"

      - name: Configure musl linker (rust-lld)
        working-directory: /tmp/opencode-pty-src
        run: |
          set -e
          # Without a linker override rustc shells out to `cc`, which chokes on
          # the self-contained musl CRT objects ("file in wrong format"). The
          # toolchain ships rust-lld for the host; point the musl target at it.
          mkdir -p .cargo
          RUST_LLD=$(find ~/.rustup/toolchains -path "*bin/rust-lld" | head -1)
          test -x "$RUST_LLD" || { echo "FATAL: rust-lld not found"; exit 1; }
          cat > .cargo/config.toml <<TOML
          [target.aarch64-unknown-linux-musl]
          linker = "$RUST_LLD"
          TOML

      - name: Build opencode-pty (static musl)
        working-directory: /tmp/opencode-pty-src
        run: |
          set -e
          # HOST env is not exported on runners, so build.rs always engages the
          # zig cross-compile; the ghostty target for musl is already mapped.
          cargo build --release --target "$RUST_TARGET"
          BIN="target/$RUST_TARGET/release/opencode-pty"
          test -f "$BIN" || { echo "FATAL: opencode-pty binary not produced"; ls -la "target/$RUST_TARGET/release/" | head -20; exit 1; }
          echo "BIN=$(realpath "$BIN")" >> "$GITHUB_ENV"

      - name: Verify static aarch64
        run: |
          set -e
          python3 - "$BIN" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:4] == b"\x7fELF", "not an ELF"
          assert data[4] == 2 and data[5] == 1, "not 64-bit little-endian"
          machine = struct.unpack_from("<H", data, 0x12)[0]
          assert machine == 183, "not AArch64"
          interp = None
          e_phoff = struct.unpack_from("<Q", data, 0x20)[0]
          phentsize, phnum = struct.unpack_from("<HH", data, 0x36)
          for i in range(phnum):
              off = e_phoff + i * phentsize
              p_type = struct.unpack_from("<I", data, off)[0]
              if p_type == 3:  # PT_INTERP
                  po = struct.unpack_from("<Q", data, off + 8)[0]
                  interp = data[po:data.index(b"\x00", po)].decode()
          assert interp is None, f"unexpected interpreter: {interp} (want fully static)"
          print("[OK] static aarch64 ELF, no interpreter — kernel-loadable on Android")
          PY

      - name: Package artifact
        run: |
          set -e
          mkdir -p dist
          NDK_STRIP="
          $(command -v llvm-strip-18 || command -v llvm-strip || command -v strip)"
          cp "$BIN" dist/opencode-pty-android-aarch64
          chmod 0755 dist/opencode-pty-android-aarch64
          "$NDK_STRIP" --strip-all dist/opencode-pty-android-aarch64 2>/dev/null || "$NDK_STRIP" dist/opencode-pty-android-aarch64 || true
          ( cd dist && sha256sum opencode-pty-android-aarch64 > SHA256SUMS )
          ls -la dist/
          cat dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-pty_static_musl
          path: dist/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: opencode-pty_static_musl
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTY_VERSION: ${{ inputs.version || '0.2.0' }}
          PTY_REPO: ${{ inputs.repo || 'anomalyco/opencode-pty' }}
        run: |
          set -e
          TAG="opencode-pty-v$PTY_VERSION"
          NOTES="Persistent PTY service for OpenCode on Android (static musl, aarch64).
          Source: $PTY_REPO @ v$PTY_VERSION + opencode-bionic patches:
          - socket dir honors OPENCODE_PTY_SOCKET_DIR / TMPDIR / XDG_RUNTIME_DIR
            (upstream hardcodes /tmp, which is read-only on Android)
          - built fully static: the kernel execs it directly on Android, no
            glibc and no Bionic loader constraints.
          Run \`opencode-pty --version\` to verify (expect 0.2.0 protocol 7)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing assets"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/opencode-pty-android-aarch64 dist/SHA256SUMS
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "opencode-pty $PTY_VERSION (static musl aarch64)" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "opencode-pty $PTY_VERSION (static musl aarch64)" --notes "$NOTES" \
              dist/opencode-pty-android-aarch64 dist/SHA256SUMS
          fi
