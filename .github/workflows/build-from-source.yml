name: Build Bun from Source (Patched for Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bun version to build (e.g., 1.4.0)'
        required: true
        default: '1.4.0'
  schedule:
    # Catch upstream patch drift weekly.
    - cron: '0 0 * * 0'

permissions:
  contents: write
  packages: write

jobs:
  build-from-source:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout this repo (for patch scripts)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Freeing disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl wget git cmake ninja-build pkg-config \
            libssl-dev libcurl4-openssl-dev \
            ruby-full \
            xz-utils unzip jq python3 \
            ccache \
            clang-18 lld-18 llvm-18

      # Bun 1.4 pins its Rust toolchain via rust-toolchain.toml; rustup
      # auto-installs it on first use inside the checkout (the build step
      # warms it up explicitly). aarch64-linux-android std comes from
      # rustup automatically — the build system runs `rustup target add`
      # for Tier 2 cross targets itself.
      - name: Install Rust (pinned via rust-toolchain.toml)
        run: |
          rustup --version || (curl -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH)

      - name: Install Android NDK (bionic sysroot + libc++ + compiler-rt)
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r27c
          add-to-path: true

      # Bun's configure tries to link the NDK's compiler-rt builtins +
      # libunwind into the HOST clang's resource dir so cross links can find
      # them (scripts/build/config.ts linkNdkRuntimesIntoClang). It warns
      # and continues on EACCES because that dir is root-owned; do it here
      # with sudo instead, or the final link dies on
      # libclang_rt.builtins-aarch64-android.a not found.
      - name: Link NDK compiler-rt into host clang resource dir
        env:
          NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          set -e
          RES="$(clang-18 -print-resource-dir)"
          echo "host clang resource dir: $RES"
          NDKLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/clang"
          NDKVER="$(command ls "$NDKLIB")"
          echo "NDK clang version dir: $NDKVER"
          SRC="$NDKLIB/$NDKVER/lib/linux"
          test -f "$SRC/libclang_rt.builtins-aarch64-android.a"
          test -f "$SRC/aarch64/libunwind.a"
          sudo mkdir -p "$RES/lib/aarch64-unknown-linux-android28" "$RES/lib/linux/aarch64"
          sudo ln -sf "$SRC/libclang_rt.builtins-aarch64-android.a" "$RES/lib/aarch64-unknown-linux-android28/libclang_rt.builtins.a"
          sudo ln -sf "$SRC/aarch64/libunwind.a"                  "$RES/lib/aarch64-unknown-linux-android28/libunwind.a"
          sudo ln -sf "$SRC/libclang_rt.builtins-aarch64-android.a" "$RES/lib/linux/libclang_rt.builtins-aarch64-android.a"
          sudo ln -sf "$SRC/aarch64/libunwind.a"                    "$RES/lib/linux/aarch64/libunwind.a"
          echo "[OK] NDK compiler-rt + libunwind linked into $RES"

      # Bun drives the Android target with host clang; our patch permits clang 18.
      - name: Verify host clang 18
        run: |
          clang-18 --version
          ld.lld-18 --version

      - name: Clone Bun source
        env:
          BUN_VERSION: ${{ github.event.inputs.version || '1.4.0' }}
        run: |
          echo "=== Cloning Bun v$BUN_VERSION ==="
          git clone --depth 1 --branch "bun-v$BUN_VERSION" \
            https://github.com/oven-sh/bun.git /tmp/bun-src
          cd /tmp/bun-src
          git submodule update --init --recursive --depth 1
          echo "Source size: $(du -sh . | cut -f1)"

      - name: Apply Android/Termux patches (strictly verified)
        run: |
          echo "=== Applying patches ==="
          chmod +x scripts/apply-android-patches.sh
          BUN_SRC=/tmp/bun-src bash scripts/apply-android-patches.sh

      - name: Install Bun for bootstrapping
        env:
          BUN_VERSION: ${{ github.event.inputs.version || '1.4.0' }}
        run: |
          echo "=== Installing Bun $BUN_VERSION for bootstrapping ==="
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build Bun for aarch64-linux-android (native Bionic binary)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          CCACHE_DIR: /tmp/ccache
        run: |
          mkdir -p /tmp/ccache
          cd /tmp/bun-src
          echo "=== Building Bun for aarch64-linux-android ==="
          echo "NDK: $ANDROID_NDK_ROOT"
          echo "Bun: $(bun --version)"
          rustup show && rustup target list --installed
          echo "Start: $(date)"

          # Upstream's Android profile configures the NDK cross-linker.
          bun scripts/build.ts --profile=android-release > /tmp/build-output.log 2>&1 || true

          echo "End: $(date)"
          echo ""
          echo "=== Build output (last 200 lines) ==="
          tail -200 /tmp/build-output.log
          echo ""
          echo "=== Checking for built binary ==="
          find build -name "bun*" -type f 2>/dev/null | head -10

          BUN_BIN=$(find build -name "bun-profile" -type f 2>/dev/null | head -1)
          if [ -z "$BUN_BIN" ]; then
            BUN_BIN=$(find build -name "bun" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$BUN_BIN" ]; then
            echo "[FATAL] no bun binary produced — see log above"
            exit 1
          fi
          cp "$BUN_BIN" /tmp/bun-patched
          echo "Binary copied to /tmp/bun-patched"

      - name: Find and verify the built binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          echo "=== Looking for built binary ==="
          if [ ! -f /tmp/bun-patched ]; then
            BUN_BIN=$(find /tmp/bun-src/build -name "bun-profile" -type f 2>/dev/null | head -1)
            [ -z "$BUN_BIN" ] && BUN_BIN=$(find /tmp/bun-src/build -name "bun" -type f 2>/dev/null | head -1)
            if [ -z "$BUN_BIN" ]; then
              echo "ERROR: Bun binary not found"
              exit 1
            fi
            cp "$BUN_BIN" /tmp/bun-patched
          fi
          file /tmp/bun-patched
          ls -lh /tmp/bun-patched

          NDK_STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$NDK_STRIP" ]; then
            "$NDK_STRIP" --strip-all /tmp/bun-patched || true
            ls -lh /tmp/bun-patched
          fi

          echo ""
          echo "=== Checking for TinyCC in binary ==="
          TCC_COUNT=$(strings /tmp/bun-patched | grep -ci "tcc\|tinycc\|libtcc")
          if [ "$TCC_COUNT" -gt 0 ]; then
            echo "[OK] TinyCC symbols found in binary ($TCC_COUNT matches)"
            strings /tmp/bun-patched | grep -i "tcc\|tinycc\|libtcc" | head -5
          else
            echo "[FAIL] No TinyCC symbols in binary — tinycc was false at build time"
            echo "  This means callback() and linkSymbols(cc:true) will not work"
            exit 1
          fi

      - name: Verify the binary is Android-native
        run: |
          file /tmp/bun-patched
          # Should show: ELF 64-bit LSB pie executable, ARM aarch64, interpreter /system/bin/linker64
          if ! file /tmp/bun-patched | grep -q "aarch64"; then
            echo "ERROR: Binary is not aarch64"
            exit 1
          fi
          if file /tmp/bun-patched | grep -q "interpreter /system/bin/linker64"; then
            echo "[OK] Bionic interpreter present"
          else
            echo "[WARN] linker64 interpreter string missing — verify manually:"
            file /tmp/bun-patched
          fi
          echo "=== Binary verification passed ==="
          echo "Native Android (Bionic) binary — runs on Termux via /system/bin/linker64"

      - name: Upload patched binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-patched-binary
          path: /tmp/bun-patched
          retention-days: 30

  package-deb:
    needs: build-from-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dpkg-dev curl

      - name: Download patched binary
        uses: actions/download-artifact@v4
        with:
          name: bun-patched-binary
          path: runtime/

      - name: Build DEB package (no proot, no shim!)
        env:
          VERSION: ${{ github.event.inputs.version || '1.4.0' }}
          ARCH: aarch64
        run: |
          set -e
          chmod +x runtime/bun-patched
          mkdir -p dist
          ROOT=$(mktemp -d)
          TMPUSR="$ROOT/data/data/com.termux/files/usr"
          mkdir -p "$ROOT/DEBIAN" "$TMPUSR/bin" "$TMPUSR/lib/bun-termux"

          install -m755 runtime/bun-patched "$TMPUSR/lib/bun-termux/bun"

          # Bun selects bunx mode from argv[0].
          install -m755 scripts/launcher-bun.sh  "$TMPUSR/bin/bun"
          install -m755 scripts/launcher-bunx.sh "$TMPUSR/bin/bunx"

          install -m755 scripts/fix-bun-network.sh "$TMPUSR/bin/bun-fix-network"

          for bin in bun bunx; do
            if [ ! -x "$TMPUSR/bin/$bin" ]; then
              echo "FATAL: $TMPUSR/bin/$bin not installed"
              exit 1
            fi
          done
          echo "[OK] bun and bunx launchers installed"
          ls -la "$TMPUSR/bin/"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: bun
          Version: $VERSION-patched
          Architecture: $ARCH
          Maintainer: bd-loser
          Section: utils
          Priority: optional
          Description: Android-native Bun runtime (source-level patches for Termux)
           Bun v$VERSION rebuilt from source with 7 source-level patches for
           Android/Bionic. No proot, no root, no LD_PRELOAD shim.
           Works natively on Termux — including bunx.
           Fixes: TinyCC enabled (SELinux-safe JIT), fchmodat2/openat2 seccomp
           traps bypassed at compile time, shebang remap to \$PREFIX/bin,
           bun:ffi finds Bionic libc + Termux headers.
          Depends: bash, ncurses, curl
          EOF
          echo "Installed-Size: $(du -sk "$ROOT" | cut -f1)" >> "$ROOT/DEBIAN/control"

          install -m755 packaging/deb/DEBIAN/postinst "$ROOT/DEBIAN/postinst"
          chmod 755 "$ROOT" "$ROOT/DEBIAN"

          dpkg-deb --build --root-owner-group "$ROOT" "dist/bun_${VERSION}-patched_${ARCH}.deb"
          rm -rf "$ROOT"
          echo ""
          echo "=== Built: dist/bun_${VERSION}-patched_${ARCH}.deb ==="
          ls -la dist/

      - name: Verify deb contents (bun + bunx launchers)
        run: |
          set -e
          DEB=$(ls dist/bun_*-patched_*.deb | head -1)
          echo "Inspecting: $DEB"
          mkdir -p /tmp/deb-check
          dpkg-deb -x "$DEB" /tmp/deb-check
          echo ""
          echo "=== Files in /usr/bin/ ==="
          ls -la /tmp/deb-check/data/data/com.termux/files/usr/bin/
          echo ""
          for bin in bun bunx; do
            PATH="/tmp/deb-check/data/data/com.termux/files/usr/bin:$PATH"
            if [ ! -x "/tmp/deb-check/data/data/com.termux/files/usr/bin/$bin" ]; then
              echo "FATAL: $bin launcher missing from deb"
              exit 1
            fi
          done
          BUNX_CONTENT="/tmp/deb-check/data/data/com.termux/files/usr/bin/bunx"
          if ! grep -q 'exec -a "bunx"' "$BUNX_CONTENT"; then
            echo "FATAL: bunx launcher does not use 'exec -a \"bunx\"'"
            echo "Content:"
            cat "$BUNX_CONTENT"
            exit 1
          fi
          if [ -e "/tmp/deb-check/data/data/com.termux/files/usr/lib/bun-termux/libbun-android-fix.so" ]; then
            echo "FATAL: LD_PRELOAD shim still packaged — should be removed for 1.4"
            exit 1
          fi
          echo "[OK] bun launcher present"
          echo "[OK] bunx launcher present and uses 'exec -a \"bunx\"'"
          echo "[OK] no shim in package"
          rm -rf /tmp/deb-check

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-patched-deb
          path: dist/*.deb
          retention-days: 30

  release:
    needs: package-deb
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download DEB
        uses: actions/download-artifact@v4
        with:
          name: bun-patched-deb
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.4.0' }}-patched
          name: Bun for Termux v${{ github.event.inputs.version || '1.4.0' }} (Source-Patched)
          files: dist/*
          generate_release_notes: true
          body: |
            # Bun for Termux v${{ github.event.inputs.version || '1.4.0' }} — Source-level patches only

            Bun built from source with **source-level patches**. **No proot, no root,
            no LD_PRELOAD shim, no termux-exec.** Works natively on Termux — including `bunx`.

            ## Changes in this rebuild

            - **Android 12 fix**: `close_range(436)` is outside Android 12's zygote
              seccomp allowlist, so the kernel TRAPPED it (SIGSYS, "Bad system call")
              at startup — Android 13+ allows it, which is why only 12 was affected.
              Replaced with a `/proc/self/fd` walk (same behavior, no syscall).
              Verified as the *only* trapped syscall: full startup + spawn + install
              syscall surface diffed against the AOSP Android 12 app policy.

            ## Architecture: source-level only (Bun 1.4, Rust)

            Every fix is compiled into the binary via `#[cfg(target_os = "android")]`
            branches or build-config changes. See `scripts/apply-android-patches.sh`.

            **Build system**
            - `config.ts`: TinyCC enabled on Android (upstream disables it)
            - `deps/tinycc.ts`: our TinyCC patches (memfd W+X mapping for SELinux,
              arm64 long-call veneers) + `CONFIG_SELINUX=1`
            - `tools.ts`: accept LLVM/clang 18 (NDK r27c / Ubuntu)

            **Syscalls Android's seccomp profile traps (SIGSYS, not ENOSYS):**
            - `src/sys/lib.rs`: `lchmod` uses `fchmodat(AT_SYMLINK_NOFOLLOW)`
              instead of the trapped `fchmodat2(452)` — unblocks `bun install`
            - `src/sys/linux_syscall.rs`: resolver walks use `openat` instead of
              the trapped `openat2(437)`

            **Spawn & FFI**
            - `posix_spawn.rs`: scripts whose shebang names a missing interpreter
              (`#!/usr/bin/env node`) are remapped to `$PREFIX/bin/<interp>` with
              argv rebuilt `[interp, script, ...]` — replaces termux-exec
            - `ffi_body.rs`: TinyCC finds Bionic libc (`/system/lib64`) and
              Termux headers/libs (`$PREFIX/include`, `$PREFIX/lib`)

            ## Installation

            ```bash
            dpkg -i bun_${{ github.event.inputs.version || '1.4.0' }}-patched_aarch64.deb

            # Everything works natively — including bunx!
            bun install
            bun run index.ts
            bunx prettier --version
            bunx create-vite my-app
            bun build
            ```

            ## Build details

            - Built from `oven-sh/bun` tag `bun-v${{ github.event.inputs.version || '1.4.0' }}`
            - Patches applied: see `scripts/apply-android-patches.sh`
            - Upstream `android-release` profile (aarch64-linux-android),
              host clang-18 + NDK r27c bionic sysroot
            - Build time: ~60-120 minutes in CI
